# Homolog local: dados + auth + BFF + frontend (+ NLP opcional).
# NODE_ENV=homolog nos serviços Node (Stripe opcional; use seed:stripe-test para premium).
# Uso:
#   cp goroute-api/.env.docker.example goroute-api/.env.docker
#   cp goroute-service-auth/.env.docker.example goroute-service-auth/.env.docker  (se existir)
#   docker compose -f docker-compose.yml -f docker-compose.homolog.yml up -d --build
#
# Frontend: http://localhost:4200
# BFF API:   http://localhost:3000/api/health
# Auth:      http://localhost:3010/health

services:
  goroute-service-auth:
    build: ./goroute-service-auth
    ports:
      - '3010:3010'
    environment:
      NODE_ENV: homolog
      PORT: 3010
      DATABASE_URL: postgresql://goroute:goroute@postgres:5432/goroute_auth
      REDIS_URL: redis://redis:6379
      AUTH_PUBLIC_URL: http://localhost:4200/goroute-auth
      FRONTEND_URL: http://localhost:4200
      COOKIE_SECURE: 'false'
      SESSION_COOKIE_NAME: goroute_session
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-homolog-internal-key}
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://host.docker.internal:4318/v1/traces}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  goroute-api:
    build: ./goroute-api
    ports:
      - '3000:3000'
    env_file:
      - path: ./goroute-api/.env.docker
        required: false
    environment:
      NODE_ENV: homolog
      PORT: 3000
      GOROUTE_DATABASE_URL: postgresql://goroute:goroute@postgres:5432/goroute_auth
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://goroute-service-auth:3010
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-homolog-internal-key}
      FRONTEND_URL: http://localhost:4200
      TYPEORM_SYNCHRONIZE: 'false'
      TYPEORM_MIGRATIONS_RUN: 'true'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: goroute_neo4j
      NLP_SERVICE_URL: http://python-nlp:5000
      MENTOR_AGENT_URL: http://goroute-mentor-agent:5010
      MENTOR_AGENT_TIMEOUT_MS: '60000'
      # OTLP HTTP (nÃ£o usar 4317 â€” essa Ã© gRPC). SigNoz no host: host.docker.internal:4318
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://host.docker.internal:4318/v1/traces}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      goroute-service-auth:
        condition: service_started
      goroute-mentor-agent:
        condition: service_started

  python-nlp:
    environment:
      NLP_ENV: homolog
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-homolog-internal-key}

  goroute-frontend:
    build: ./goroute-frontend
    ports:
      - '4200:80'
    depends_on:
      - goroute-api
      - goroute-service-auth

  ollama:
    image: ollama/ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

  goroute-mentor-agent:
    build: ./goroute-mentor-agent
    ports:
      - '5010:5010'
    environment:
      MENTOR_ENV: homolog
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-homolog-internal-key}
      SLM_PROVIDER: ${SLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      NLP_SERVICE_URL: http://python-nlp:5000
      HOSTED_SLM_API_KEY: ${HOSTED_SLM_API_KEY:-}
      HOSTED_SLM_BASE_URL: ${HOSTED_SLM_BASE_URL:-https://api.groq.com/openai/v1}
      HOSTED_SLM_MODEL: ${HOSTED_SLM_MODEL:-llama-3.2-3b-preview}
      SLM_REQUEST_TIMEOUT_SEC: '50'
    depends_on:
      - python-nlp
      - ollama

volumes:
  ollama_data:

